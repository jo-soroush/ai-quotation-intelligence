[project]
name = "ai-quotation-intelligence"
version = "0.1.0"
description = "Local-first AI quotation intelligence system baseline"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
